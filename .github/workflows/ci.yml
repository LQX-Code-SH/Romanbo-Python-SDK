name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python-version: "3.8" }
          - { os: ubuntu-latest,  python-version: "3.10" }
          - { os: ubuntu-latest,  python-version: "3.13" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: macos-latest,   python-version: "3.11" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: 单元测试
        run: python -m unittest discover -s tests -t . -v

      - name: 基准报文自检（60 条逐字节比对）
        run: python -m romanbo selftest

      - name: 离线冒烟（模拟器）
        run: python -m romanbo --mock scan

  build:
    name: 构建发行包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建 sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: 校验产物内容（含 py.typed 与控制台脚本）
        run: |
          python -c "
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith('romanbo/py.typed') for n in names), names
          assert any(n.endswith('entry_points.txt') for n in names), names
          print('wheel 内容校验通过:', wheel)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
