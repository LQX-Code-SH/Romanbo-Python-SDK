name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建并校验发行包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 构建 sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: 校验元数据与产物内容
        run: |
          python -m twine check dist/*
          python -c "
          import glob, tarfile, zipfile

          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith('romanbo/py.typed') for n in names), 'wheel 缺少 py.typed'
          assert any(n.endswith('entry_points.txt') for n in names), 'wheel 缺少控制台脚本入口'
          assert any(n.endswith('LICENSE') for n in names), names

          sdist = glob.glob('dist/*.tar.gz')[0]
          with tarfile.open(sdist) as tf:
              files = tf.getnames()
          for required in ('README.md', 'LICENSE', 'CHANGELOG.md', 'mkdocs.yml'):
              assert any(f.endswith('/' + required) for f in files), f'sdist 缺少 {required}'
          print('发行包内容校验通过:', wheel, sdist)
          "

      - name: 从 sdist 安装并冒烟（确认发布物可用）
        run: |
          python -m pip install dist/*.tar.gz --force-reinstall --no-deps
          python -m romanbo selftest
          python -m romanbo --mock scan

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: 发布到 PyPI
    needs: build
    runs-on: ubuntu-latest
    # 默认**跳过**：PyPI 侧需先配置 Trusted Publishing（见 CONTRIBUTING.md「发布」）。
    # 未配置时这一步会以认证失败变红、把整个 Release 工作流染红，而 GitHub Release
    # 其实已经成功——2026-09-27 首次发版就是这么红的。配好后把**仓库变量**
    # PUBLISH_PYPI 设为 true（Settings → Secrets and variables → Actions → Variables）
    # 即启用。
    if: vars.PUBLISH_PYPI == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/romanbo
    permissions:
      id-token: write          # OIDC，无需 API token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: 创建 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            发行包见下方附件；变更详情见 [CHANGELOG.md](https://github.com/LQX-Code-SH/Romanbo-Python-SDK/blob/main/CHANGELOG.md)。

            安装：`pip install romanbo`
